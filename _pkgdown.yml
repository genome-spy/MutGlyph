url: https://genomespy.app/MutGlyph/

home:
  title: "MutGlyph: Interactive Cancer Genomics Plots in R"
  description: >
    Create interactive, zoomable oncoplots, rainfall plots, protein lollipop
    plots, and GISTIC copy-number landscapes in R with GenomeSpy.

template:
